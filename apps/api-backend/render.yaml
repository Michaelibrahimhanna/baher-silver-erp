# =============================================================================
# RENDER.COM BLUEPRINT FOR BAHER SILVER ERP API BACKEND
# =============================================================================

services:
  - type: web
    name: baher-silver-erp-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build && npx prisma db push && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
