<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام باهر سيلفر لإدارة وتصنيع الفضة — ERP v4.0 Enterprise</title>
  
  <!-- Official Baher Silver Favicon -->
  <link rel="icon" type="image/png" href="assets/baher_logo.png">
  <link rel="shortcut icon" href="assets/baher_logo.png">

  <!-- Arabic & English Google Fonts (Tajawal, Cairo, Outfit, Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDFBF7',
              100: '#F7F3E9',
              500: '#C3B097',
              600: '#A8947B',
              700: '#8A7760',
              900: '#524331',
            },
            cyanbrand: {
              500: '#06B6D4',
              600: '#0891B2',
            },
            silver: {
              100: '#F8FAFC',
              300: '#CBD5E1',
              400: '#94A3B8',
              500: '#64748B',
            },
            gold: {
              400: '#F59E0B',
              500: '#D97706',
              600: '#B45309',
            },
            darkbg: '#090D16',
            cardbg: 'rgba(15, 23, 42, 0.80)',
            borderdark: 'rgba(195, 176, 151, 0.15)'
          },
          fontFamily: {
            sans: ['Tajawal', 'Cairo', 'Inter', 'sans-serif'],
            display: ['Cairo', 'Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-slate-950">
  <div id="app" class="flex flex-col min-h-screen"></div>

  <!-- Standard Script Loading -->
  <script src="js/app.js"></script>

</html>
